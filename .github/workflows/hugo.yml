name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show repo tree
        run: |
          pwd
          ls -la
          echo "--- content ---"
          find content -maxdepth 3 -print
          echo "--- root ---"
          find . -maxdepth 2 -print

      - name: Download and Install Hugo Binary
        run: |
          curl -L "https://github.com/gohugoio/hugo/releases/download/v0.128.0/hugo_extended_0.128.0_Linux-64bit.tar.gz" -o hugo.tar.gz
          tar -xzf hugo.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Compile Static Site
        run: |
          rm -rf public
          hugo --cleanDestinationDir --verbose --destination public
          echo "--- public ---"
          find public -maxdepth 3 -type f | sort
          touch ./public/.nojekyll

      - name: Upload Build Output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
