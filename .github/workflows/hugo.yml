# Complete workflow for building and deploying a Hugo site to GitHub Pages with Dart Sass
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Official Hugo build engine setup action
      - name: Setup Hugo
        uses: hugo94/setup-hugo@v1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Installs Dart Sass natively to bypass Snap sandboxing blocks
      - name: Install Dart Sass
        run: |
          curl -LJO "https://github.com"
          tar -xvf dart-sass-1.79.4-linux-x64.tar.gz
          echo "$(pwd)/dart-sass" >> $GITHUB_PATH

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      # Compiles the layout cleanly using your hugo.toml configuration directly
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
