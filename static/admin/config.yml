backend:
  name: github
  repo: aquahonoredhi/hugotest         # Path to your GitHub repository
  branch: master                      # Target branch for CMS content

  # Crucial for routing OAuth through Netlify
  base_url: https://api.netlify.com
  site_id: https://aquahugotest.netlify.app/  # Replace with your exact Netlify dummy site domain

media_folder: "assets/media"
collections:
  - name: "archives" # Used in routes, e.g., /admin/collections/blog
    label: "All Articles" # Used in the UI
    folder: "content/articles" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: "Layout", name: "layout", widget: "hidden", default: "text" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "thumbnail", widget: "image" }
      - { label: "Body", name: "body", widget: "markdown" }