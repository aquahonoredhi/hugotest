media:
  - name: default
    label: Default
    input: static/media
    output: /media

content:
  - name: author
    label: Staff (Active)
    type: collection
    path: content/staff
    filename: "{slug}.md"
    fields:
      - name: name
        label: Author Name
        type: string
        required: true

  - name: author_inactive
    label: Staff (Inactive)
    type: collection
    path: content/staff-inactive
    filename: "{slug}.md"
    fields:
      - name: name
        label: Author Name
        type: string
        required: true

  - name: categories
    label: Categories
    type: collection
    path: content/category-data
    filename: "{slug}.md"
    exclude: ["_index.md"]
    fields:
      - name: name
        label: Category Name
        type: string
        required: true

  - name: articles
    label: Articles
    type: collection
    path: content/articles
    filename: "{slug}.md"      # Flat naming layout restored for manual routing
    fields:
      - name: title
        type: string
        required: true
      - name: author
        label: Author
        type: reference
        options:
          collection: author   # fixed: was "authors"
          value: "{fields.name}"
      - name: nickname
        label: Per-Article Nickname
        type: string
        required: false
      - name: categories
        label: Categories
        type: reference
        options:
          collection: categories
          multiple: true
          value: "{fields.name}"
      - name: cover
        label: Cover image
        type: image
        options:
          media: default
      - name: draft
        label: Draft?
        type: boolean
      - name: date
        label: Date
        type: date
      - name: body
        type: rich-text

  - name: pages
    label: Pages
    type: collection
    path: content/pages
    filename: "{slug}.md"
    fields:
      - name: title
        type: string
        required: true
      - name: draft
        label: Draft?
        type: boolean
      - name: body
        type: rich-text

  - name: menu
    label: Site Menu
    type: file
    path: config/_default/menus.yaml
    format: yaml
    fields:
      - name: main
        label: Main Menu
        type: object
        list: true
        fields:
          - name: name
            label: Link Text
            type: string
            required: true
          - name: url
            label: URL or path (e.g. /articles/, /staff/ or https://example.com)
            description: Type any path on the site, or an external link. Use this OR "Page reference" below.
            type: string
          - name: pageRef
            label: Page reference (optional)
            description: Content path of a page, e.g. /pages/about or /articles/2020/05/my-article. Follows the page if its URL changes.
            type: string
          - name: weight
            label: Order (lower numbers appear first)
            type: number
          - name: identifier
            label: Identifier (only needed if this item has sub-items)
            type: string
          - name: parent
            label: Parent identifier (set to nest this under another item)
            type: string