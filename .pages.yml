media:
  - name: default
    label: Default
    input: static/media
    output: /media

content:
  - name: author
    label: Staff (Active)
    type: collection
    path: content/staff
    filename: "{slug}.md"
    fields:
      - name: name
        label: Author Name
        type: string
        required: true

  - name: author_inactive
    label: Staff (Inactive)
    type: collection
    path: content/staff-inactive
    filename: "{slug}.md"
    fields:
      - name: name
        label: Author Name
        type: string
        required: true

  - name: categories
    label: Categories
    type: collection
    path: content/category-data
    filename: "{slug}.md"
    exclude: ["_index.md"]
    fields:
      - name: name
        label: Category Name
        type: string
        required: true

  - name: articles
    label: Articles
    type: collection
    path: content/articles
    filename: "{slug}.md"      # Flat naming layout restored for manual routing
    fields:
      - name: title
        type: string
        required: true
      - name: author
        label: Author
        type: reference
        options:
          collection: author   # fixed: was "authors"
          value: "{fields.name}"
      - name: nickname
        label: Per-Article Nickname
        type: string
        required: false
      - name: categories
        label: Categories
        type: reference
        options:
          collection: categories
          multiple: true
          value: "{fields.name}"
      - name: cover
        label: Cover image
        type: image
        options:
          media: default
      - name: draft
        label: Draft?
        type: boolean
      - name: date
        label: Date
        type: date
      - name: body
        type: rich-text
  - name: navigation
    type: file
    path: config/_default/menus.yaml
    fields:
      - name: main
        type: block
        label: Main Navigation Items
        fields:
          - name: menu_item
            type: object
            label: Link
            fields:
              - name: name
                type: string
                label: Display Name
              - name: pageRef
                type: string
                label: Internal Page Path (e.g., /about)
              - name: weight
                type: number
                label: Order Position