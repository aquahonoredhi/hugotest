media:
  - name: default
    label: Default
    input: assets/media
    output: /assets/media

  - name: cover_images
    label: Cover Images
    input: assets/media/coverImages
    output: /assets/media/coverImages

content:
  - name: authors
    label: Authors
    type: collection
    path: content/authors
    fields:
      - name: name
        label: Author Name
        type: string
        required: true
        
  - name: tags
    label: Tags
    type: collection
    path: content/tags
    fields:
      - name: name
        label: Tag Name
        type: string
        required: true

  - name: articles
    label: Articles
    type: collection
    path: content/articles
    fields:
      - name: title
        type: string
        required: true
      - name: author
        label: Author
        type: reference
        options:
          collection: authors
          value: "{fields.name}"
      - name: nickname
        label: Per-Article Nickname
        type: string
        required: false
      - name: tags
        label: Tags
        type: list            # Allows selecting multiple entries
        options:
          field:              # Defines the configuration for the list items
            type: reference
            options:
              collection: tags
              value: "{fields.name}"
      - name: cover
        label: Cover image
        type: image
        options:
          media: cover_images
      - name: draft
        label: Draft?
        type: boolean
      - name: date
        label: Date
        type: date
      - name: body
        type: rich-text
