media:
  - name: default
    label: Default
    input: assets/media
    output: /assets/media

  - name: cover_images
    label: Cover Images
    input: assets/media/coverImages
    output: /assets/media/coverImages

content:
  - name: authors
    label: Authors
    type: collection
    path: content/authors
    filename: "{slug}"
    fields:
      - name: name
        label: Author Name
        type: string
        required: true
      - name: active
        label: Active Author?
        type: boolean
        default: true
        
  - name: tags
    label: Tags
    type: collection
    path: content/tags
    filename: "{slug}"
    fields:
      - name: name
        label: Tag Name
        type: string
        required: true

  - name: articles
    label: Articles
    type: collection
    # Dynamically places files in year/month folders based on the chosen article date
    path: "content/articles/{year}/{month}" 
    filename: "{slug}" # Uses the text title slug for the file name (e.g. title.md)
    fields:
      - name: title
        type: string
        required: true
      - name: author
        label: Author
        type: reference
        options:
          collection: authors
          value: "{fields.name}"
      - name: nickname
        label: Per-Article Nickname
        type: string
        required: false
      - name: tags
        label: Tags
        type: list
        options:
          field:
            type: reference
            options:
              collection: tags
              value: "{fields.name}"
      - name: cover
        label: Cover image
        type: image
        options:
          media: cover_images
      - name: draft
        label: Draft?
        type: boolean
      - name: date
        label: Date
        type: date
        required: true     # Recommended so the year/month path tokens always resolve
      - name: body
        type: rich-text
