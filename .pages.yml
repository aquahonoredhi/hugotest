media:
  - name: Default
    input: assets/media
    output: /assets/media

  - name: Cover Images
    input: assets/media/coverImages
    output: /assets/media/coverImages

content:
  - name: Articles
    label: Articles
    type: collection
    path: content/articles
    fields:
      - name: cover
        label: Cover image
        type: image
        options:
          media: cover_images    # Directs this field strictly to the coverImages folder
      - name: title
        type: string
      - name: body
        type: rich-text
