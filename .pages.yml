media:
  - name: default
    label: Default
    input: assets/media
    output: /assets/media

  - name: cover_images
    label: Cover Images
    input: assets/media/coverImages
    output: /assets/media/coverImages

content:
   - name: authors
     type: collection
     label: Authors
     path: content/authors
     fields:
      - name: name
        label: Author Name
        type: string
        required: true
        
  - name: Articles
    label: Articles
    type: collection
    path: content/articles
    fields:
      - name: cover
        label: Cover image
        type: image
        options:
          media: cover_images    # Directs this field strictly to the coverImages folder
      - name: draft
        label: Draft?
        type: boolean
      - name: title
        type: string
      - name: date
        label: Date
        type: date
      - name: body
        type: rich-text

