media:
  input: assets/media
  output: /assets/media

content:
  - name: authors
    label: Authors
    type: collection
    path: content/authors
    fields:
      - name: name
        label: Author Name
        type: string
        required: true
        
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    fields:
      - name: title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        widget: relation
        collection: authors
        value_field: name
      - name: nickname
        label: Per-Article Nickname
        type: string
        required: false
      - name: cover
        label: Cover image
        type: image
        path: coverImages  # Places files under assets/media/coverImages
      - name: draft
        label: Draft?
        type: boolean
      - name: date
        label: Date
        type: date
      - name: body
        type: rich-text
